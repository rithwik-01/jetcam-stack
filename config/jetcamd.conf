# JetCam Orin Nano defaults: Argus/ISP + NVMM conversion + software x264.
sensor_id=0
width=1280
height=720
framerate=60
bitrate_kbps=6000
gop=60
output=udp
host=127.0.0.1
port=5000

# Used when output=rtsp.
rtsp_port=8554
rtsp_mount=/jetcam

# SIGUSR1 opens the snapshot branch for exactly one JPEG frame.
snapshot_file=/tmp/jetcam-snapshot.jpg
snapshot_on_start=false
